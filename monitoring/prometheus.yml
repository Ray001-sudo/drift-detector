global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'drift-interceptor'
    static_configs:
      - targets: ['drift-interceptor:8000']
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: 'drift-processor'
    static_configs:
      - targets: ['drift-processor:6066']
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: 'drift-alerter'
    static_configs:
      - targets: ['drift-alerter:6066']
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: 'drift-dashboard'
    static_configs:
      - targets: ['drift-dashboard:443']
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9101']
    scrape_interval: 15s

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 15s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 15s
