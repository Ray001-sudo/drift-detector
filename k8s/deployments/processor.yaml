apiVersion: apps/v1
kind: Deployment
metadata:
  name: drift-processor
  namespace: drift-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: drift-processor
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: drift-processor
    spec:
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
      containers:
      - name: processor
        image: myregistry.com/drift-processor:latest
        envFrom:
        - configMapRef:
            name: drift-config
        - secretRef:
            name: drift-secrets
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi
