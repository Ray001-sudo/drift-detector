apiVersion: apps/v1
kind: Deployment
metadata:
  name: drift-dashboard
  namespace: drift-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: drift-dashboard
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: drift-dashboard
    spec:
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
      containers:
      - name: dashboard
        image: myregistry.com/drift-dashboard:latest
        ports:
        - containerPort: 443
        envFrom:
        - configMapRef:
            name: drift-config
        - secretRef:
            name: drift-secrets
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 443
            scheme: HTTPS
          initialDelaySeconds: 15
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 443
            scheme: HTTPS
          initialDelaySeconds: 5
