apiVersion: apps/v1
kind: Deployment
metadata:
  name: drift-interceptor
  namespace: drift-system
spec:
  replicas: 3
  selector:
    matchLabels:
      app: drift-interceptor
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: drift-interceptor
    spec:
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - drift-interceptor
              topologyKey: kubernetes.io/hostname
      containers:
      - name: interceptor
        image: myregistry.com/drift-interceptor:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: drift-config
        - secretRef:
            name: drift-secrets
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 15
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 5
