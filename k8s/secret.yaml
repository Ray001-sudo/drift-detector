apiVersion: v1
kind: Secret
metadata:
  name: drift-secrets
  namespace: drift-system
type: Opaque
# IMPORTANT: Never commit real secrets. 
# In production, use HashiCorp Vault or AWS Secrets Manager with External Secrets Operator to populate this.
stringData:
  DATABASE_URL: "postgresql+asyncpg://user:pass@db:5432/drift"
  REDIS_URL: "redis://:pass@redis:6379/0"
  KAFKA_SASL_USERNAME: "placeholder"
  KAFKA_SASL_PASSWORD: "placeholder"
  JWT_SECRET_KEY: "placeholder"
  SLACK_WEBHOOK_URL: "placeholder"
  PAGERDUTY_ROUTING_KEY: "placeholder"
