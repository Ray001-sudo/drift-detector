apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: drift-system
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dashboard-ingress
  namespace: drift-system
spec:
  podSelector:
    matchLabels:
      app: drift-dashboard
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-kafka-db-redis
  namespace: drift-system
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - ports:
    - protocol: TCP
      port: 9092 # Kafka
    - protocol: TCP
      port: 5432 # Postgres
    - protocol: TCP
      port: 6379 # Redis
    - protocol: TCP
      port: 443  # External HTTPS (Slack, PagerDuty, etc)
    - protocol: UDP
      port: 53   # DNS
