apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: drift-processor-hpa
  namespace: drift-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: drift-processor
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: External
    external:
      metric:
        name: kafka_consumer_lag
        selector:
          matchLabels:
            topic: inference.features
      target:
        type: Value
        value: 1000
